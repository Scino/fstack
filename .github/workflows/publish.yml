name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Install Chromium for browse tests
        run: npx --yes playwright install --with-deps chromium

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag (v$TAG_VERSION)"
            exit 1
          fi

      - run: node tools/test-suite.mjs
      - run: node tools/validate-skills.mjs

      - name: Publish to npm (OIDC trusted publisher)
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'false'
